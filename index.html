<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#141C18; --mute:#5C6862; --line:#D6DDD8;

  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font:800 clamp(34px,6vw,56px)/.95 var(--f-disp);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;font:600 13px/1.4 var(--f-body);letter-spacing:.08em;color:var(--mute);margin-top:8px;text-transform:uppercase}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--panel)}
.pill.live{color:var(--up);border-color:currentColor}
button{font:inherit;cursor:pointer}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}
.cell{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:grid;gap:4px;align-content:start}
.lbl{font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.val{font:600 22px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.sub{font:12px/1.35 var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
section{display:grid;gap:10px}
h2{font:800 22px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;margin:0}
.note{font-size:13px;color:var(--mute);margin:0;max-width:65ch}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:var(--panel);position:sticky;top:0}
td{font:14px/1.3 var(--f-mono)}
tr:last-child td{border-bottom:0}
th:nth-child(2),td:nth-child(2){text-align:left}
td.rk{font-weight:600;color:var(--mute)}
tr.prize td{background:var(--gold-soft)}
tr.prize td.rk{color:var(--gold)}
.did{display:inline-flex;gap:8px;align-items:center}
.copy{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:4px;font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px}
.copy:hover{color:var(--ink)}
.tag{font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:3px;padding:3px 5px}

.chart{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 12px 8px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);padding:4px 4px 0}
.legend b{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--mute)}
footer{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:8px;font-size:13px;color:var(--mute)}
footer p{margin:0;max-width:80ch}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}

  const n=q.n||p.n||0, pct=Math.min(100,n/LOCK*100), left=dur(T_LOCK-Date.now()), sleft=dur(T_S-Date.now());
  const cells=[
    [t("sweep"), `${ni(n)}<span class="sub"> / ${ni(LOCK)}</span>`, `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>`],
    [t("lock"), left? `${left}`:t("locked"), `<span class="sub">${utc(T_LOCK)}</span>`],
    [t("S"), p.t==="final"? nf(p.price) : (sleft||"—"), `<span class="sub">${t("Sat")}</span>`],
    [t("ref"), nf((p.ref||{}).px), `<span class="sub">${p.limits? nf(p.limits[0])+" – "+nf(p.limits[1]) : ""}</span>`],
    [t("glob"), nf(q.mark||p.global), `<span class="sub">${t("globsub")}</span>`],
    [t("keys"), ni(st.owners), `<span class="sub">${st.rooms? ni(st.rooms)+" rooms":""}</span>`],
    [t("ls"), `${ni(po.longs)}<span class="sub"> / ${ni(po.shorts)}</span>`, ""],
    [t("open"), nf(po.open,0), ""]
  ];
  $("board").innerHTML = cells.map(([a,b,c])=>`<div class="cell"><span class="lbl">${a}</span><span class="val">${b}</span>${c}</div>`).join("");
  $("mode").textContent = isLive? t("live") : `${t("snap")} ${ni(n)}`;
  $("mode").className = "pill"+(isLive?" live":"");
}

function renderTop(){
  const q=L.pnl||{}, po=L.positions||{}, rows=q.top||[];
  const pos=Object.fromEntries((po.top||[]).map(([k,v])=>[k,v]));
  $("topnote").textContent = t("topnote")(nf(q.mark));
  let html="", i=0;
  while(i<rows.length){
    let j=i; while(j+1<rows.length && rows[j+1][1]===rows[i][1]) j++;
    const rank = i===j? `${i+1}` : `${i+1}–${j+1}`;
    for(let k=i;k<=j;k++){
      const [did,sc]=rows[k], prize=i<3;
      const s=Number(sc);
      html+=`<tr class="${prize?"prize":""}"><td class="rk">${rank}</td>`+
        `<td><span class="did" title="${did}">${short(did)} <button class="copy" type="button" data-did="${did}">${t("copy")}</button>${prize?` <span class="tag">${t("prize")}</span>`:""}</span></td>`+
        `<td style="color:${s>=0?"var(--up)":"var(--down)"}">${s>=0?"+":""}${nf(s)}</td><td>${pos[did]!=null? nf(pos[did]) : "—"}</td></tr>`;
    }
    i=j+1;
  }
  $("rows").innerHTML = html;
}

document.addEventListener("click", async (e)=>{
  const b=e.target.closest(".copy"); if(!b) return;
  try{ await navigator.clipboard.writeText(b.dataset.did); b.textContent=t("copied"); }
  catch(err){ const r=document.createRange(); r.selectNodeContents(b.parentNode.firstChild); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  setTimeout(()=>{ b.textContent=t("copy"); },1500);
});

/* ---------- charts (SVG, one linear scale per axis) ---------- */
function niceTicks(lo,hi,n=4){ const span=hi-lo||1, step0=span/n, mag=10**Math.floor(Math.log10(step0));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0); const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6)); return out; }
function chart(svg, series, opt){
  const W=440,H=opt.h||200, l=46,r=12,tp=10,b=24, el=$(svg);
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])), ys=series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null);
  if(xs.length<2){ el.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">${t("wait")}</text>`; return; }
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  if(opt.zero) y0=Math.min(0,y0); const pad=(y1-y0)*.08||1; y0-=opt.zero&&y0===0?0:pad; y1+=pad;
  const X=v=>l+(v-x0)/(x1-x0||1)*(W-l-r), Y=v=>H-b-(v-y0)/(y1-y0)*(H-tp-b);
  let g="";
  for(const v of niceTicks(y0,y1)){ if(v<y0||v>y1) continue; g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Y(v)+3}" text-anchor="end">${opt.fy? opt.fy(v): v}</text>`; }
  // x ticks: days (sweep -> date)
  const dayMs=864e5; for(let d=Math.ceil((OPEN+x0*3e5)/dayMs)*dayMs; d<=OPEN+x1*3e5; d+=dayMs){ const sx=(d-OPEN)/3e5;
    g+=`<line x1="${X(sx)}" x2="${X(sx)}" y1="${tp}" y2="${H-b}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(sx)}" y="${H-b+14}" text-anchor="middle">${new Date(d).toISOString().slice(8,10)}/${new Date(d).toISOString().slice(5,7)}</text>`; }
  for(const s of series){
    if(s.bars){ const w=Math.max(1,(W-l-r)/s.pts.length-1); for(const [x,y] of s.pts) g+=`<rect x="${X(x)-w/2}" y="${Y(Math.max(y,0))}" width="${w}" height="${Math.abs(Y(0)-Y(y))}" fill="${s.c}" opacity=".85"/>`; continue; }
    const d=s.pts.filter(p=>p[1]!=null).map((p,k)=>(k?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" stroke-linejoin="round"/>`;
    const last=s.pts.filter(p=>p[1]!=null).at(-1); if(last) g+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3" fill="${s.c}"/>`;
  }
  el.innerHTML=g;
}
function renderCharts(){
  const sw=(DATA&&DATA.sweeps)||[], hist=(DATA&&DATA.hist)||[];
  const lastSw=sw.length? sw.at(-1)[0] : 0, after=hist.filter(h=>h[0]>lastSw&&h[4]!=null);
  chart("c_prix",[{pts:sw.map(r=>[r[0],r[1]]).concat(after.map(h=>[h[0],h[4]])),c:"var(--accent)"},{pts:sw.map(r=>[r[0],r[2]]).concat(after.map(h=>[h[0],h[5]])),c:"var(--series2)",w:1.2}],{h:210,fy:v=>v.toFixed(0)});
  $("actnote").textContent = t("actnote")(sw.length? sw.at(-1)[0] : 0);
  chart("c_scores",[{pts:hist.map(h=>[h[0],h[3]]),c:"var(--mute)",w:1.2},{pts:hist.map(h=>[h[0],h[2]]),c:"var(--accent)"},{pts:hist.map(h=>[h[0],h[1]]),c:"var(--gold)"}],{h:190,fy:v=>Math.round(v)});
  const hrs={}; for(const r of sw){ const k=Math.floor((r[0]-1)/12); hrs[k]=hrs[k]||[0,0]; hrs[k][0]+=r[5]; hrs[k][1]+=r[3]; }
  const ks=Object.keys(hrs).map(Number).sort((a,b)=>a-b);
  chart("c_act",[{pts:ks.map(k=>[k*12+6,hrs[k][0]]),c:"var(--accent)",bars:true},{pts:ks.map(k=>[k*12+6,hrs[k][1]]),c:"var(--series2)",w:1.4}],{h:190,zero:true,fy:v=>v>=1e6?(v/1e6)+"M":v>=1e3?(v/1e3)+"k":v});
}

function renderText(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>{ const v=TXT[lang][e.dataset.i]; if(typeof v==="string") e.textContent=v; });
  $("f1").textContent=t("f1"); $("f2").textContent=t("f2");
  $("f3").textContent=t("f3")(DATA? DATA.genere.replace("T"," ").slice(0,16)+" UTC":"—");
}
function renderAll(){ renderText(); renderBoard(); renderTop(); renderCharts(); }

/* ---------- live refresh: works where the page may reach technocore.chat (CORS is open) ---------- */
async function last(room, kind){
  const r=await fetch(`https://technocore.chat/r/${room}?format=json&limit=2`,{cache:"no-store"}); if(!r.ok) throw 0;
  const ms=(await r.json()).messages||[];
  for(let i=ms.length-1;i>=0;i--){ if(ms[i].from!==ARB) continue; try{ const b=JSON.parse(ms[i].text); if(b.t===kind||(kind==="price"&&b.t==="final")) return b; }catch(e){} }
  return null;
}
async function refresh(){
  try{
    const [price,pnl,positions,state]=await Promise.all([last("d-close1-price","price"),last("d-close1-pnl","pnl"),last("d-close1-positions","positions"),last("d-close1-state","state")]);
    if(pnl){ L={price:price||L.price,pnl,positions:positions||L.positions,state:state||L.state}; isLive=true; renderBoard(); renderTop(); }
  }catch(e){ isLive=false; renderBoard(); }
}
renderAll();
refresh(); setInterval(refresh,60e3); setInterval(renderBoard,30e3);
</script>
